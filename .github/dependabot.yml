# Weekly pull requests for dependency updates. CI checks each one before it can be merged.
# Major versions (new Node, Python or TypeScript releases, for example) are upgraded
# deliberately by hand, not by bot, because they need testing across the whole platform.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: weekly
    ignore:
      # PyTorch comes from the CPU-only index and is upgraded together with torchvision by hand.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /services/ai]
    schedule:
      interval: weekly
    ignore:
      # Base images stay on the tested Node 24, Python 3.11 and Nginx 1.28 lines.
      - dependency-name: node
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: nginx
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
