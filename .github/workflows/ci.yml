# Continuous integration: every push to main and every pull request must pass these checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Web, API and shared package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # API integration tests run against a real MySQL, like production.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: vetnexa_test
          MYSQL_USER: vetnexa
          MYSQL_PASSWORD: vetnexa_ci_password
          MYSQL_ROOT_PASSWORD: vetnexa_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pvetnexa_ci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Test-only values for the throwaway CI database; not secrets.
      DATABASE_URL: mysql://vetnexa:vetnexa_ci_password@127.0.0.1:3306/vetnexa_test
      TEST_DATABASE_URL: mysql://vetnexa:vetnexa_ci_password@127.0.0.1:3306/vetnexa_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@vetnexa/api

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (Vitest, Supertest, Testing Library)
        run: npm test

      - name: Production builds
        run: npm run build

  python:
    name: AI service
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt

      - name: Install packages (CPU-only PyTorch)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose file
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: services/ai
          push: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai
