[project]
name = "vetnexa-ai"
version = "0.1.0"
description = "VetNexa AI service: wound image assessment (decision-support prototype)"
authors = [{ name = "Pradeesha Baskaran" }]
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Report writer: long Markdown table rows and SVG templates read better unwrapped.
"vetnexa_ai/evaluate_triage.py" = ["E501"]
